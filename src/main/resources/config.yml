# RoyalSkyblock: main configuration
# Each island is its own Advanced Slime Paper world, loaded on demand and unloaded
# when empty. Most values reload with /is reload; world/storage changes need a restart.
#
# Config files:
#    config.yml       this file: storage, world backend, island gen, currencies,
#                     coop, spawn, flow limiter, teleport
#    lang.yml         every player-facing string (& colours, %tokens%)
#    bank.yml         the built-in bank: levels, interest, upgrade costs
#    levels.yml       island-level block values, scan tuning, level-up rewards
#    upgrades/*.yml   island upgrades, one file per track (size / guest limit / ...)
#    perks/*.yml      OPTIONAL level-gated perks, one file each (off by default;
#                     the switches are in the perks: section of this file)
#    gamemodes/*.yml  Solo / Coop / Ironman rulesets
#    gui/<cat>/*.yml  one file per menu, grouped into folders:
#                     core / profile / island / coop / bank / level
#    Reload ALL of the above with /is reload.

# Island storage
# Where island metadata lives (owner, members, level, upgrades). Island blocks live in
# the slime data source below.
storage:
  # sqlite (default), mysql (a network), or eco.
  #
  # eco stores everything in eco's own data-handler, like the rest of the suite; the
  # mysql block below is then ignored. eco storage is for ONE server only: servers
  # sharing one eco database overwrite each other's data. For a network, use mysql.
  #
  # Switching to eco: stop the server, set eco, start. An existing islands.db is
  # migrated, verified, and renamed to islands.db.migrated; if anything doesn't match,
  # the file is left alone and the plugin refuses to start.
  type: sqlite
  # SQLite database file name (under the plugin folder).
  sqlite-file: islands.db
  mysql:
    host: localhost
    port: 3306
    database: royalskyblock
    username: root
    password: ""
    pool-size: 10
    # JDBC properties appended to the connection URL (query-string form, same as the rest of the suite).
    properties: "useSSL=false&characterEncoding=utf8"

# World backend (Advanced Slime Paper)
world:
  # The ASP data-source islands are stored in. Must be a loader ASP has registered:
  #   file  : flat .slime files under the ASP world folder (single server only)
  #   mysql : slime blobs in MySQL   (recommended: shardable across a network)
  #   mongo : slime blobs in MongoDB
  # For a multi-server network use "mysql" (or "mongo") so any server can load any island.
  slime-data-source: file

  # Islands are named "<prefix><owner-uuid>" in the data source.
  world-name-prefix: "island_"

  # Seconds an island stays loaded after its last player leaves. 0 = unload at once.
  # An unloaded island doesn't tick; the simulation section below pays the time back.
  unload-grace-seconds: 60

  # Max islands unloaded per pass (every 5 seconds), so a mass logout doesn't unload
  # every island in one tick. Longest-empty go first.
  max-unloads-per-tick: 2

  # Default world properties applied to every new island world.
  properties:
    difficulty: normal          # peaceful | easy | normal | hard
    allow-monsters: true
    allow-animals: true
    pvp: false
    environment: normal         # normal | nether | end
    world-type: default
    default-biome: minecraft:plains

# Islands
island:
  # Where inside the island world the schematic origin (or generated starter) is pasted.
  paste:
    x: 0
    y: 100
    z: 0

  # Where a fresh island's home sits, relative to the paste origin above.
  home-offset:
    x: 0
    y: 1
    z: 0
    yaw: 0
    pitch: 0

  # Starting protection radius (blocks from island centre). The island-size upgrade raises this.
  starting-radius: 80

  # Base number of guests that can /visit at once (before the guest-limit upgrade adds more).
  base-guest-limit: 3

  # What a visitor may do on someone else's island (coop members are not restricted).
  #   read-only  Walk around, open doors, press buttons, sit in boats. Cannot take
  #              or change anything (containers, item frames, armour stands,
  #              animals, dropped items, crops). Default.
  #   strict     Every interaction is refused, including doors.
  #
  # Either way a visitor cannot break, place, or use buckets.
  protection:
    visitor-mode: read-only

  # Max members on a fresh island (owner counts as one). Raised by island upgrades.
  starting-member-limit: 4

  # Cooldown (seconds) between an island reset and the next allowed reset.
  reset-cooldown-seconds: 300

  # The starter island that gets built for a new player.
  starter:
    # A schematics/<name>.schem file (standard WorldEdit/Sponge format) pasted via WorldEdit or FAWE
    # when installed. If neither is present, or the file is missing, the built-in generator below is
    # used instead. Save one in-game with: /is admin schematic save <name>
    schematic: default
    # Built-in generator (fallback when there's no schematic): an 11x11 house the player
    # spawns in, a crop farm, a pond with sugar cane, an oak grove and a stone outcrop.
    # A second island with a portal to spawn sits across a gap the player has to bridge.
    platform-radius: 17          # island radius; the outline bulges a few blocks past this
    platform-block: GRASS_BLOCK  # top surface
    sub-block: DIRT              # two layers beneath the surface
    tree: true                  # plant the oak grove

    # The second island and its portal home.
    portal-island: true
    portal-island-distance: 34   # centre-to-centre; ~10 blocks of open air to bridge
    portal-island-radius: 7
    bedrock-anchor: true        # a bedrock block under the centre
    chest:
      enabled: true             # set false to skip the starter chest entirely
      # Starter chest contents, one per line as `<item>` or `<item>:<amount>`. Items go
      # through eco's lookup, so any installed eco item works:
      #   - "ecominions:stone"      a Stone Minion
      #   - "ecominions:stone:2"    two of them
      #   - "ecoitems:my_pickaxe"
      items:
        - "ICE:2"
        - "LAVA_BUCKET:1"
        - "OAK_SAPLING:2"
        - "MELON_SLICE:1"
        - "PUMPKIN_SEEDS:1"
        - "SUGAR_CANE:1"
        - "BONE_MEAL:4"

  # A per-player world border at the island edge; scales with island size. Players with
  # royalskyblock.bypass don't get one.
  border:
    enabled: true
    # blue | red | green | off. Change live with /is admin border <colour>.
    color: blue
    warning-blocks: 2           # red screen vignette this many blocks before the edge
    # Log where the border applies/clears per player (troubleshooting "I don't see a border").
    debug: false

  # World rules: gamerules applied when an island loads, gamemode when a player enters.
  # Island worlds aren't managed by Multiverse, so RoyalSkyblock sets these itself.
  world-rules:
    # Minecraft gamemode on islands: survival | adventure | creative | spectator (not the
    # profile's Solo/Coop/Ironman). enforce-gamemode: false leaves it alone;
    # royalskyblock.playmode.bypass exempts staff.
    enforce-gamemode: true
    gamemode: survival
    # Any gamerule. Keys accept 26.2 ids (keep_inventory), classic names (keepInventory)
    # or a minecraft: prefix. Unknown names are skipped with a warning.
    gamerules:
      keep_inventory: true              # don't drop items on death
      mob_griefing: false               # creepers/endermen don't wreck the island
      advance_weather: false            # no rain
      show_advancement_messages: false  # no "made the advancement" spam
      # Deliberately left at vanilla defaults (uncomment to override):
      #   advance_time: true            # islands cycle day/night
      #   fall_damage: true             # fall damage applies
      #   spawn_monsters: true          # vanilla mobs spawn on unlit islands at night
      #
      # If you use island-mobs below, set spawn_monsters: false: vanilla mobs carry no tier
      # tag, so the Intimidation bridge can't calm them.
      #   spawn_monsters: false

  # Void protection: catch a fall below below-y instead of slow vanilla void damage.
  void:
    enabled: true
    # Y treated as the void. Islands paste at y~100 (world floor is -64). Keep it below
    # anything players build or mine down to.
    below-y: 0
    # What happens when a player drops below below-y on an island:
    #   teleport - pull them back to the island home (recommended)
    #   kill     - kill instantly (still respects keep_inventory) instead of ticking down
    #   none     - leave vanilla void behaviour alone
    action: teleport
    # Damage dealt on a teleport rescue, in hearts. 0 = no penalty. (kill/none ignore this.)
    damage: 0
    # Chat line shown on rescue (& colour codes; leave blank for silent).
    message: "&cYou fell into the void and were pulled back to your island."

# Profiles (Hypixel-style saves: each has its own island, inventory & progression)
profiles:
  # How many profiles a player may have.
  max-profiles: 3

  # Let eco read and write the active profile's data directly instead of copying every key
  # on each switch. Needs an eco that supports it; otherwise copying continues. Safe to leave on.
  eco-resolver: true

# Coop (shared-island profiles)
coop:
  # Max members on a Coop profile, including the owner.
  max-members: 4
  # How long a coop invite stays valid before it expires.
  invite-timeout-seconds: 60

  # Shared coop bank. Backed by RoyalBank's shared-account API when RoyalBank is installed, otherwise a
  # Vault-backed balance RoyalSkyblock owns. Needs an economy (Vault) either way.
  bank:
    # Preset deposit/withdraw amount buttons in the coop-bank GUI (first three are shown).
    amounts:
      - 100
      - 1000
      - 10000
    # Cap for the Vault-backed store. -1 = unlimited. (The RoyalBank backend uses its own
    # shared-accounts.max-balance instead.)
    max-balance: -1
    # Require owner/co-owner to withdraw? Deposits are always open to members.
    withdraw-requires-manager: false

# Currencies (used by upgrade costs)
# Named currencies; upgrade costs reference them by key (e.g. 5000 coins). Two kinds:
#   type: vault    -> your server's Vault economy.
#   type: command  -> anything else: balance from a PlaceholderAPI placeholder, charge and
#                     refund via console commands (%player% and %amount% are substituted).
# 'coins' (Vault) is the default; the rest are examples to keep, edit or delete.
currencies:
  coins:
    type: vault
    display-name: "coins"

  # EcoBits gems (needs EcoBits + PlaceholderAPI). Replace "gems" with your EcoBits currency
  # id (the `id:` in EcoBits/config.yml) in all three places.
  gems:
    type: command
    display-name: "gems"
    balance-placeholder: "%ecobits_gems%"
    take-command: "ecobits take %player% gems %amount%"
    give-command: "ecobits give %player% gems %amount%"

  # More examples: uncomment/edit for your setup:
  #
  # PlayerPoints:
  #   tokens:
  #     type: command
  #     display-name: "tokens"
  #     balance-placeholder: "%playerpoints_points%"
  #     take-command: "points take %player% %amount%"
  #     give-command: "points give %player% %amount%"
  #
  # Any placeholder + command currency (blocks, crystals, whatever your plugin exposes):
  #   crystals:
  #     type: command
  #     display-name: "crystals"
  #     balance-placeholder: "%yourplugin_crystals%"
  #     take-command: "yourplugin take %player% crystals %amount%"
  #     give-command: "yourplugin give %player% crystals %amount%"

# Spawn / hub: where players go when they leave or lose an island. Point `world` at your hub.
spawn:
  world: world
  # Route players to this spawn on JOIN and on death (bedless respawns), unless they logged out on
  # their own island. Beds / respawn anchors are respected. Turn off if another plugin manages spawns.
  teleport-on-join: true
  # Use that world's own spawn point. Set false to use the explicit coordinates below.
  use-world-spawn: true
  x: 0.5
  y: 100.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0
  # Catch players who fall off the hub (a no-damage hub would let them fall forever).
  void:
    enabled: true
    # Below this Y the player is sent back to spawn. Keep it under the lowest part of the hub build
    # (the world floor is -64; vanilla void damage starts at -128).
    below-y: -70
    # Chat line shown on rescue (& colour codes; leave blank for silent).
    message: "&7You fell off the hub and were brought back to spawn."

# NPC-only commands: refused when a player types them; NPCs, menu buttons and hotbar items
# still work. Point each NPC at `/is admin npc-open <player> <command>` from the console
# (e.g. Citizens' `npc command add is admin npc-open <p> bazaar`); gamemode rules still apply.
# List the main name or any alias. `where` fills %where% in lang.yml's general.npc-only.
# royalskyblock.npconly.<key> lets a player type one anyway (ops have it by default).
npc-only-commands:
  enabled: false
  commands:
    bazaar:
      where: "Bazaar"
    ah:
      where: "Auction House"
    bank:
      where: "Bank"

# Offline simulation: when an unloaded island is next visited, fast-forward the time it missed.
# Crops are handled here; other plugins (minions) use the IslandCatchupEvent API.
simulation:
  enabled: true

  # Max hours simulated, however long the island sat unloaded. Mainly bounds minion output.
  # 0 = no cap (not recommended once minions are in).
  max-offline-hours: 24

  # Vertical band the scan walks (islands paste at y=100).
  scan-y-min: 60
  scan-y-max: 180

  crops:
    enabled: true
    # Average seconds per growth stage on a hydrated, lit farm (each stage is rolled, so fields
    # ripen unevenly). ~130s is close to vanilla wheat. Lower = more generous.
    seconds-per-stage: 130
    # Covers the age-based crops: wheat, carrots, potatoes, beetroot, nether wart, cocoa, berries.

  # Sugar cane and cactus, tuned per block grown.
  stacking-plants:
    enabled: true
    # Average seconds to add one block to a column (vanilla is ~18 minutes).
    seconds-per-block: 1080
    # Tallest a column may reach (vanilla is 3). Growth only places into air.
    max-height: 3

  # Melon/pumpkin stems and saplings are not simulated: they could overwrite builds.

# Extensions load from plugins/RoyalSkyblock/extensions/. Names listed here (case-insensitive)
# load and then stop, for isolating a fault without deleting the jar.
extensions:
  disabled: []

# Island mob spawning (optional; needs a mob backend from an extension). Night mobs spawn near
# online players on islands, tiered by Combat skill. Turn off vanilla hostiles with the
# spawn_monsters gamerule (island.world-rules). Per-island toggle: the MOB_SPAWNS setting.
island-mobs:
  enabled: false                 # off until your provider mobs are configured
  # Mob backend id, registered by an extension.
  provider: ecomobs
  # Skills backend for combat level and the intimidation stat. Blank = whichever is installed.
  progression: ""
  combat-skill: combat           # skill id, in whichever progression backend is in use
  scan-interval-ticks: 200       # how often a spawn pass runs (200 = every 10s)
  only-night: true               # only spawn during the night
  first-night-grace-ticks: 24000 # no spawns until an island is this old (24000 = 1 MC day)
  require-low-light: true
  max-light-level: 7
  require-member-present: true    # a visitor alone on an island won't trigger spawns
  owner-combat-level: false       # false = scale to the present player; true = always the island owner
  combat-level-cap: 15            # tier is min(combat level, this)
  spawn-radius-min: 12            # spawn between this and max blocks from the player
  spawn-radius-max: 28
  max-mobs-per-island: 12         # our tagged mobs alive on an island at once
  max-spawns-per-scan-per-island: 3
  spawn-attempts: 6               # tries to find a valid spot per spawn
  debug: false
  # Intimidation: island mobs whose tier is at or below a player's Intimidation stat ignore them.
  # Only mobs RoyalSkyblock spawned are affected.
  intimidation:
    enabled: true
    stat: intimidation           # stat id the talismans grant, in the progression backend above
    # Ignore level = min(combat level, stat). false = use the raw stat.
    cap-to-combat-level: true

  # Mob id looked up in the provider, e.g. private_island_zombie_7.
  mob-id-format: "private_island_%family%_%level%"
  # Weighted families to pick from. Each family needs matching provider mobs
  # <family>_1 .. <family>_<combat-level-cap>, e.g. private_island_zombie_1 .. _15.
  # Higher weight = spawns more often (weights are relative, they don't need to total 100).
  # Set enabled: false to switch a family off without losing its settings.
  families:
    zombie:
      weight: 35
      enabled: true
    skeleton:
      weight: 25
      enabled: true
    spider:
      weight: 15
      enabled: true
    cave_spider:
      weight: 8
      enabled: true
    slime:
      weight: 8
      enabled: true
    enderman:
      weight: 6
      enabled: true
    witch:
      weight: 3
      enabled: true

# Anti-crash: liquid flow limiter
flow-limiter:
  enabled: true
  # Max water/lava flow events per world (= per island) per second before flow is blocked for
  # the rest of that second. Defuses lag machines.
  max-per-second: 800
  # Seconds the limiter pauses in a world after a royalskyblock.bypass player empties a bucket.
  admin-bypass-seconds: 30

# Teleport safety
teleport:
  # Scan upward for a safe (non-suffocating, solid-footed) spot before dropping a
  # player at a home/visit location. If none is found within this many blocks, fall
  # back to the raw location.
  safe-scan-height: 8

# Perks: optional, off by default (they overlap upgrades). The perks themselves are in perks/.
# When on, a perk is active while its owner is on their own island at the required level, and its
# unlock-commands run once when the island first reaches it.
perks:
  enabled: false
  # Seconds between re-applying on-island potion effects.
  effect-refresh-seconds: 6

# Messages / misc
settings:
  # Seconds a chat prompt (e.g. naming an island) waits for input before giving up.
  chat-prompt-timeout-seconds: 30
  # Emit anonymous usage stats via bStats.
  bstats: true
  # Print extra timing/debug lines to console.
  debug: false

# Profiles
profile:
  # Hotbar slots (1-9) owned by another plugin (e.g. RoyalJoin's menu item), left out of the
  # per-profile inventory so the item isn't duplicated or lost on a profile switch.
  externally-managed-hotbar-slots: []

# Island trash: deleted islands are archived to plugins/RoyalSkyblock/trash/ as .slime files.
#   /is admin trash list                       - what's recoverable
#   /is admin trash restore <archive> <player> - give the blocks back to their
#                                                active profile (must have no island)
# A delete whose archive fails is ABORTED, not carried out unrecoverably.
# /is admin orphans [purge] also parks unreferenced worlds here, always.
trash:
  enabled: true
  # Days an archive is kept before pruning. 0 = keep forever.
  retention-days: 30
