#  RoyalSkyblock  ·  Upgrade track: minions
#  One file per upgrade track; the file name is the track's id.
#
#    display-name : shown in the menu (& colour codes)
#    icon         : the menu item
#    description  : one-line summary in the icon lore
#    effect       : what a tier changes: radius / guest_slots / coop_slots /
#                   generator / minions / none (none = the effects chain IS the upgrade)
#
#  Per tier (1, 2, 3, ...):
#    value      : the effect number at that tier
#    cost       : pay this, then wait `time`            (e.g. 5000 coins)
#    skip-cost  : pay this instead to finish instantly
#    time       : the wait: 2d / 4h / 30m / 45s / 0    (0 = instant)
#    effects    : OPTIONAL libreforge chain granted while the island is at this tier.
#                 Applies to anyone standing on the island. Only the CURRENT tier's
#                 chain is active, so write each tier as the full effect you want.
#    conditions : OPTIONAL libreforge conditions.
#
#  Minion limits are EcoMinions per-player permissions, so each tier's unlock-commands
#  grant the matching permission to the island owner. Requires EcoMinions (with
#  limits.per-player.enabled and permission-overrides, its defaults) and LuckPerms;
#  without them tiers charge and grant nothing.
#
#  Keep the world=%world% scope: permissions belong to the account, and an unscoped
#  grant would apply on all the owner's profiles. EcoMinions still counts minions on
#  every profile toward the limit. Coop members keep their own default limit.
#
#  EcoMinions' default limit is 5, so tier N grants 5 + N. Commands must be idempotent:
#  reaching a tier twice runs them twice.

display-name: "&e&lMinion Slots"
icon: armor_stand
description: "Place more AFK minions on your island."
effect: minions
# 'value' is the total bonus slots at that tier (each tier adds one). RoyalMinions reads the tier
# count and grants that many slots on top of its own `slot-limit`, so tier 5 here = 5 extra minions.
tiers:
  1:
    value: 1
    cost: 5000 coins
    skip-cost: 8000 coins
    time: 6h
    unlock-commands:
      - "lp user %owner% permission set ecominions.limit.6 true world=%world%"
  2:
    value: 2
    cost: 15000 coins
    skip-cost: 24000 coins
    time: 12h
    unlock-commands:
      - "lp user %owner% permission set ecominions.limit.7 true world=%world%"
  3:
    value: 3
    cost: 40000 coins
    skip-cost: 64000 coins
    time: 1d
    unlock-commands:
      - "lp user %owner% permission set ecominions.limit.8 true world=%world%"
  4:
    value: 4
    cost: 100000 coins
    skip-cost: 160000 coins
    time: 2d
    unlock-commands:
      - "lp user %owner% permission set ecominions.limit.9 true world=%world%"
  5:
    value: 5
    cost: 250000 coins
    skip-cost: 400000 coins
    time: 3d
    unlock-commands:
      - "lp user %owner% permission set ecominions.limit.10 true world=%world%"
