#  RoyalSkyblock  ·  Perk: haste
#  One file per perk; the file name is the perk's id. Perks are off until
#  perks.enabled is true in config.yml, and apply only on the owner's own island.
#
#    name            shown in the perks menu (& colour codes)
#    icon            menu item
#    required-level  island level needed to unlock it
#    description     lore lines in the menu
#    effects         what the perk grants. Two forms, mixable in one list:
#                      "haste:0"                  potion shorthand, 0-based level
#                      - id: give_money           any eco effect, with
#                        args: {amount: 25}       conditions/chance/triggers
#    conditions      optional libreforge conditions gating the whole perk
#    unlock-commands console commands run once on unlock (%owner% / %level%)
#
#  A triggered effect needs a trigger that supplies its data: drop effects such as
#  multiply_drops want block_item_drop / entity_item_drop / catch_fish, not mine_block.

# Early game
name: "&e&lMiner's Haste"
icon: golden_pickaxe
required-level: 5
description:
  - "&7Mine faster while on your island."
effects:
  - "haste:0"
unlock-commands: []
