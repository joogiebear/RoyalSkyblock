# ═══════════════════════════════════════════════════════════════════════════════
#  RoyalSkyblock  ·  Perk: overseer
# ═══════════════════════════════════════════════════════════════════════════════
#  One file per perk. The FILE NAME is the perk's id — copy this file to add a
#  perk, nothing to register. Perks are OFF until you set `enabled: true` in
#  perks.yml, and each applies only while its owner stands on their OWN island.
#
#    name            shown in the perks menu (& colour codes)
#    icon            menu item
#    required-level  island level needed to unlock it
#    description     lore lines in the menu
#    effects         what the perk grants. Two forms, mixable in one list:
#                      "haste:0"                  potion shorthand, 0-based level
#                      - id: give_money           any of the 275 eco effects,
#                        args: {amount: 25}       with conditions/chance/triggers
#    conditions      OPTIONAL libreforge conditions gating the whole perk
#    unlock-commands console commands run ONCE on unlock (%owner% / %level%)
#
#  A triggered effect only fires if its trigger supplies what it needs — pairing
#  multiply_drops with mine_block silently never runs, because mining carries no
#  drop data. Drop effects want block_item_drop / entity_item_drop / catch_fish.
#
#  NOT LOADED AS SHIPPED. The leading underscore marks this an example, the same
#  way eco ships _example.yml files — rename it to overseer.yml to enable it.
#
#  It is off by default because it is the one perk with a hard dependency: both
#  its minion_pickup trigger and its minion_count_above condition come from
#  RoyalSkyblock's EcoMinions bridge, and without EcoMinions installed they do
#  not exist. libreforge would report an invalid effect and an invalid condition
#  at every boot, and — worse — the perk would still load with its condition
#  dropped, handing the bonus to everyone at the required level regardless of
#  how many minions they run.
# ═══════════════════════════════════════════════════════════════════════════════


# minion_count_above and minion_pickup are registered by RoyalSkyblock itself —
# EcoMinions fires Bukkit events but no libreforge elements, so nothing in any eco
# config could see minion activity until this plugin published it.

name: "&6&lMinion Overseer"
icon: armor_stand
required-level: 70
description:
  - "&7Run a real operation — more than"
  - "&7ten minions — and every collection"
  - "&7pays you a finder's fee."
conditions:
  - id: minion_count_above
    args:
      count: 10
effects:
  - id: give_money
    args:
      amount: 100
    triggers:
      - minion_pickup
unlock-commands: []
