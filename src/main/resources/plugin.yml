name: RoyalSkyblock
version: ${version}
main: com.mystipixel.royalskyblock.RoyalSkyblockPlugin
api-version: '26.2'
author: Mystipixel
description: Scalable per-island Skyblock built on Advanced Slime Paper.
# JDBC drivers + connection pool are downloaded at runtime by Paper's library loader.
# Keep these identical to the matching compileOnly versions in build.gradle.kts.
libraries:
  - org.xerial:sqlite-jdbc:3.53.4.0
  - com.zaxxer:HikariCP:7.1.0
  - com.mysql:mysql-connector-j:26.7.0
# eco is a HARD dependency: RoyalSkyblock is an eco plugin (its main class extends LibreforgePlugin)
# and cannot load without the platform.
depend:
  - eco
# ASP provides its world API as part of the server fork, so it is not listed as a (soft)depend.
# libreforge is only a softdepend because it ships bundled inside this jar.
# Every plugin an extension hooks must be listed here: extensions have no plugin.yml, so this is
# their only control over load order. A missing one can enable after RoyalSkyblock, and the
# extension's integration is then skipped silently.
softdepend:
  - libreforge
  - Vault
  - EcoItems
  - EcoMobs
  - EcoMinions
  - EcoSkills
  - PlaceholderAPI
  - WorldEdit
  - FastAsyncWorldEdit
# Commands are registered by eco from CommandIsland and BankCommand; no commands: block here.

permissions:
  royalskyblock.use:
    description: Base access to island commands.
    default: true
  royalskyblock.create:
    default: true
  royalskyblock.home:
    default: true
  royalskyblock.visit:
    default: true
  royalskyblock.invite:
    default: true
  royalskyblock.upgrade:
    default: true
  royalskyblock.settings:
    default: true
  royalskyblock.bank:
    description: Access the bank (/bank).
    default: true
  royalskyblock.admin:
    description: Administrative island management.
    default: op
  royalskyblock.bypass:
    description: Bypass island build protection anywhere.
    default: op
  royalskyblock.gamemode.bypass:
    description: Bypass gamemode command rules (e.g. Ironman blocked commands). Not granted to ops by default.
    default: false
  royalskyblock.playmode.bypass:
    description: Exempt from island gamemode enforcement (island.world-rules), so you keep your own gamemode (e.g. creative to build).
    default: op
