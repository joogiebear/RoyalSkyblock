name: RoyalSkyblock
version: ${version}
main: com.mystipixel.royalskyblock.RoyalSkyblockPlugin
api-version: '26.2'
author: Mystipixel
description: Scalable per-island Skyblock built on Advanced Slime Paper.
# JDBC drivers + connection pool are downloaded at runtime by Paper's library loader.
libraries:
  - org.xerial:sqlite-jdbc:3.46.1.3
  - com.zaxxer:HikariCP:5.1.0
  - com.mysql:mysql-connector-j:8.4.0
# eco is a HARD dependency: RoyalSkyblock is an eco plugin (its main class extends LibreforgePlugin)
# and cannot load without the platform.
depend:
  - eco
# ASP provides its world API as part of the server fork, so it is not listed as a (soft)depend.
# libreforge is only a softdepend because it ships bundled inside this jar.
# Every plugin any EXTENSION hooks MUST be listed here, even though this plugin no longer hooks one
# itself. Extensions load inside RoyalSkyblock's own enable and have no plugin.yml of their own, so
# they cannot declare a dependency — this list is the only lever on load order they have.
#
# Bukkit enables softdepends first. A plugin missing from here can enable *after* RoyalSkyblock, so an
# extension's isPluginEnabled() guard reads false and the integration is skipped silently, with no
# error to find. That is exactly how the EcoMinions triggers failed to register the first time.
#
# So: adding an extension that hooks a new plugin means adding that plugin here.
softdepend:
  - libreforge
  - Vault
  - EcoItems
  - EcoMobs
  - EcoMinions
  - EcoSkills
  - PlaceholderAPI
  - WorldEdit
  - FastAsyncWorldEdit
# Commands are registered by eco from the command classes themselves (CommandIsland, BankCommand),
# which is where the rest of the suite declares its name, aliases, description and permission. There
# is deliberately no `commands:` block here — a second declaration would be a second source of truth.

permissions:
  royalskyblock.use:
    description: Base access to island commands.
    default: true
  royalskyblock.create:
    default: true
  royalskyblock.home:
    default: true
  royalskyblock.visit:
    default: true
  royalskyblock.invite:
    default: true
  royalskyblock.upgrade:
    default: true
  royalskyblock.settings:
    default: true
  royalskyblock.bank:
    description: Access the bank (/bank).
    default: true
  royalskyblock.admin:
    description: Administrative island management.
    default: op
  royalskyblock.bypass:
    description: Bypass island build protection anywhere.
    default: op
  royalskyblock.gamemode.bypass:
    description: Bypass gamemode command rules (e.g. Ironman blocked commands). Not granted to ops by default.
    default: false
  royalskyblock.playmode.bypass:
    description: Exempt from island gamemode enforcement (island.world-rules), so you keep your own gamemode (e.g. creative to build).
    default: op
