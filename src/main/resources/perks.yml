# ═══════════════════════════════════════════════════════════════════════════════
#  RoyalSkyblock  ·  Perks — settings
# ═══════════════════════════════════════════════════════════════════════════════
#  The perks themselves live in the perks/ folder, one file per perk, the way every
#  eco plugin ships its content. Copy a file there to add a perk — the file name is
#  its id and there is nothing to register. This file is only the two switches.
#
#  Perks are OPTIONAL and OFF by default. They overlap the purchased upgrades
#  system, so most servers won't want both.
#
#  While OFF: no effects, no menu button, no overhead.
#  While ON:  each perk is a libreforge effect holder, active while its owner stands
#             on their own island and the island is high enough level, and its
#             unlock-commands run ONCE the first time the island reaches that level.
#
#  Part of the RoyalSkyblock config set — see config.yml for the full file map.
# ═══════════════════════════════════════════════════════════════════════════════

enabled: false

# Seconds between re-applying on-island potion effects (kept a touch shorter than the
# effect duration so they never flicker). Lower = snappier, slightly more work.
effect-refresh-seconds: 6
