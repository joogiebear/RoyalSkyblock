# ═══════════════════════════════════════════════════════════════════════════════
#  RoyalSkyblock  ·  Level-Gated Perks
# ═══════════════════════════════════════════════════════════════════════════════
#  OPTIONAL, and OFF by default. Perks unlock as your island's level (see levels.yml)
#  rises. They overlap the purchased upgrades system, so most servers won't need
#  both — flip `enabled` to true only if you want them.
#
#  While OFF: no effects, no menu button, no overhead.
#  While ON:  each perk applies its potion effects to a player standing on their own
#             island (once the island is high enough), and runs its unlock-commands
#             ONCE the first time the island reaches that level.
#
#  Each perk:
#    name             shown in the perks menu (& colour codes)
#    icon             menu item
#    required-level   island level needed to unlock it
#    description      lore lines in the menu
#    effects          what the perk grants while on-island. TWO forms, mixable in one list:
#
#                       1. potion shorthand — NAME:amplifier, amplifier 0-based
#                          (0 = level I, 1 = level II). e.g. haste:1
#
#                       2. a libreforge effect — the same `id:`/`args:` blocks the rest of
#                          the eco suite uses, so a perk can grant ANY eco effect, not just
#                          potions, and can carry its own conditions, chance and filters:
#
#                            effects:
#                              - "haste:0"                    # shorthand, still fine
#                              - id: give_money               # libreforge effect
#                                args:
#                                  amount: 100
#                                triggers: [ mine_block ]
#
#                       Both forms may appear in the same list — each is read by the side
#                       that understands it. See the eco wiki for the full effect list.
#    conditions       optional libreforge conditions gating the whole perk, same dialect.
#    unlock-commands  console commands run ONCE on unlock. %owner% / %level%. Empty = none.
#
#  Perks apply only on your OWN island. (Island upgrades in upgrades.yml take the same
#  `effects:` blocks but apply to anyone standing on the island.)
#
#  Part of the RoyalSkyblock config set — see config.yml for the full file map.
# ═══════════════════════════════════════════════════════════════════════════════

enabled: false

# Seconds between re-applying on-island potion effects (kept a touch shorter than the
# effect duration so they never flicker). Lower = snappier, slightly more work.
effect-refresh-seconds: 6

perks:
  haste:
    name: "&e&lMiner's Haste"
    icon: golden_pickaxe
    required-level: 5
    description:
      - "&7Mine faster while on your island."
    effects:
      - "haste:0"
    unlock-commands: []

  regen:
    name: "&a&lIsland Renewal"
    icon: golden_apple
    required-level: 15
    description:
      - "&7Slowly regenerate on your island."
    effects:
      - "regeneration:0"
    unlock-commands: []

  swift:
    name: "&b&lSwift Steps"
    icon: feather
    required-level: 30
    description:
      - "&7Move quicker across your island."
    effects:
      - "speed:0"
    # Example one-time unlock reward (needs an economy command; edit for your setup):
    # unlock-commands:
    #   - "eco give %owner% 5000"
    unlock-commands: []

  # Example of the libreforge form — commented out so a fresh install stays vanilla.
  # This one is not a potion at all: it pays out while you mine on your own island, which
  # the old potion-only format simply could not express.
