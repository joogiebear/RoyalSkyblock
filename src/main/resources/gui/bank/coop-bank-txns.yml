#  RoyalSkyblock  ·  Coop Bank: Transactions
#  The 0 slots fill at runtime with the coop bank's recent ledger entries (newest
#  first). Only available with the RoyalBank backend; the Vault fallback has no ledger.
#
#  rows: 1-6. mask: 1 = filler pane, 0 = dynamic slot. Slots are placed by row/column.
#  click ids: open_menu, close, player_command, console_command, message, play_sound
#  sound: on a slot is its click sound (name / volume / pitch, or enabled: false).
#  A slot without one is silent; leave buttons that open another menu silent so
#  the destination's open sound doesn't double up.

title: "&8Skyblock &7» &fCoop Transactions"
rows: 6

# Menu sounds (enabled: false silences one). Click sounds live on each slot.
#   open     - when the menu is opened
#   content  - when a generated button that closes the menu is clicked
sounds:
  open:
    enabled: true
    name: UI_BUTTON_CLICK
    volume: 0.7
    pitch: 1.2

pages:
  - page: 1
    mask:
      items:
        - black_stained_glass_pane
      pattern:
        - "111111111"
        - "100000001"
        - "100000001"
        - "100000001"
        - "111111111"
        - "111111111"

slots:
  # (the « Back that returns to the right bank is under back: below)
  - item: barrier name:"&cClose"
    lore:
      - "&7Close this menu."
    row: 6
    column: 5
    left-click:
      - id: close
    sound:
      name: UI_BUTTON_CLICK
      volume: 0.6
      pitch: 1.2

# Back to whichever bank the log was opened from.
back:
  item: arrow name:"&7« Back"
  lore:
    - "&7Return to the bank."
  row: 6
  column: 4

# In the first 0 slot when the account has no history.
empty:
  item: paper name:"&7No transactions yet"
  lore:
    - "&7Deposits, withdrawals, upgrades,"
    - "&7and interest will show here."

# A ledger entry. %amount% %balance% %note% %type%
entry:
  lore:
    - "&7Amount: &e%amount%"
    - "&7Balance after: &f%balance%"
  # entries that carry a note
  lore-note:
    - "&7Amount: &e%amount%"
    - "&7Balance after: &f%balance%"
    - "&8%note%"

# The item and name for each kind of entry; other is any kind not listed (%type% is its raw id).
types:
  deposit: lime_dye name:"&aDeposit"
  withdraw: gold_nugget name:"&6Withdraw"
  upgrade: anvil name:"&bUpgrade"
  interest: experience_bottle name:"&dInterest"
  other: paper name:"&7%type%"
