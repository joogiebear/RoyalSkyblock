#  RoyalSkyblock  ·  Personal Bank
#  Your own bank for the active profile (per-profile: a new profile starts fresh).
#  Balance/level header + Deposit/Withdraw/Interest/Upgrade/Transactions are placed
#  by code; this is the frame. Levels come from bank.yml.
#
#  rows: 1-6. mask: 1 = filler pane, 0 = dynamic slot. Slots are placed by row/column.
#  click ids: open_menu, close, player_command, console_command, message, play_sound
#  sound: on a slot is its click sound (name / volume / pitch, or enabled: false).
#  A slot without one is silent; leave buttons that open another menu silent so
#  the destination's open sound doesn't double up.

title: "&8Skyblock &7» &fPersonal Bank"
rows: 6

# Menu sounds (enabled: false silences one). Click sounds live on each slot.
#   open     - when the menu is opened
#   content  - when a generated button that closes the menu is clicked
sounds:
  open:
    enabled: true
    name: UI_BUTTON_CLICK
    volume: 0.7
    pitch: 1.2

pages:
  - page: 1
    mask:
      items:
        - black_stained_glass_pane
      pattern:
        - "111111111"
        - "111111111"
        - "111111111"
        - "111111111"
        - "111111111"
        - "111111111"

slots:
  - item: barrier name:"&cClose"
    lore:
      - "&7Close this menu."
    row: 6
    column: 5
    left-click:
      - id: close
    sound:
      name: UI_BUTTON_CLICK
      volume: 0.6
      pitch: 1.2

  # Returns to the main menu. player_command closes the inventory itself in
  # RoyalSkyblock, so this needs no separate close effect: unlike the other
  # menus, which reach main with open_menu.
  - item: arrow name:"&fBack"
    lore:
      - "&7Return to the main menu."
    row: 6
    column: 3
    # The menu plays its own open sound; without this the two land together and
    # are heard as one doubled click.
    silent: true
    left-click:
      - id: player_command
        args: {command: "menu"}
    sound:
      name: UI_BUTTON_CLICK
      volume: 0.6
      pitch: 1.2
