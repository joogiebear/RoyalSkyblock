# ═══════════════════════════════════════════════════════════════════════════════
#  RoyalSkyblock  ·  Personal Bank
# ═══════════════════════════════════════════════════════════════════════════════
#  Your own bank for the active profile (per-profile — a new profile starts fresh).
#  Balance/level header + Deposit/Withdraw/Interest/Upgrade/Transactions are placed
#  by code; this is the frame. Levels come from bank.yml.
#
#  Rendered through eco's Menu API. The dialect below is RoyalSkyblock's own —
#  eco draws the menu, this file describes it:
#    rows 1–6 · mask: 1 = filler pane, 0 = dynamic slot · slots placed by row/column
#    click ids: open_menu · close · player_command · console_command · message · play_sound
#    slot options: sound: — the sound clicking this slot makes (name / volume / pitch,
#      or enabled: false). A slot with no sound: block is SILENT. There is no menu-wide
#      click sound: a button that opens another menu should stay silent and let the
#      destination's open sound speak, or the two land together as one doubled click.
# ═══════════════════════════════════════════════════════════════════════════════

title: "&8Skyblock &7» &fPersonal Bank"
rows: 6

# The sound this menu makes when it opens. Delete it or set enabled: false to silence.
# Click sounds are NOT here — each slot carries its own sound: block, and a slot without
# one is silent. See the slot options above.
#   open     - when the menu is opened
#   content  - when a GENERATED button is clicked (only on menus whose generated
#              buttons close the inventory; the rest are covered by the open sound
#              of whatever menu they reopen)
sounds:
  open:
    enabled: true
    name: UI_BUTTON_CLICK
    volume: 0.7
    pitch: 1.2

pages:
  - page: 1
    mask:
      items:
        - black_stained_glass_pane
      pattern:
        - "111111111"
        - "111111111"
        - "111111111"
        - "111111111"
        - "111111111"
        - "111111111"

slots:
  - item: barrier name:"&cClose"
    lore:
      - "&7Close this menu."
    row: 6
    column: 5
    left-click:
      - id: close
    sound:
      name: UI_BUTTON_CLICK
      volume: 0.6
      pitch: 1.2
