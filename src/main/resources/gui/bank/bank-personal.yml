#  RoyalSkyblock  ·  Personal Bank
#  Your own bank for the active profile (per-profile: a new profile starts fresh).
#  The balance header and Deposit/Withdraw/Interest/Upgrade/Transactions buttons are
#  under header: and buttons: at the end. Levels come from bank.yml.
#
#  rows: 1-6. mask: 1 = filler pane, 0 = dynamic slot. Slots are placed by row/column.
#  click ids: open_menu, close, player_command, console_command, message, play_sound
#  sound: on a slot is its click sound (name / volume / pitch, or enabled: false).
#  A slot without one is silent; leave buttons that open another menu silent so
#  the destination's open sound doesn't double up.

title: "&8Skyblock &7» &fPersonal Bank"
rows: 6

# Menu sounds (enabled: false silences one). Click sounds live on each slot.
#   open     - when the menu is opened
#   content  - when a generated button that closes the menu is clicked
sounds:
  open:
    enabled: true
    name: UI_BUTTON_CLICK
    volume: 0.7
    pitch: 1.2

pages:
  - page: 1
    mask:
      items:
        - black_stained_glass_pane
      pattern:
        - "111111111"
        - "111111111"
        - "111111111"
        - "111111111"
        - "111111111"
        - "111111111"

slots:
  - item: barrier name:"&cClose"
    lore:
      - "&7Close this menu."
    row: 6
    column: 5
    left-click:
      - id: close
    sound:
      name: UI_BUTTON_CLICK
      volume: 0.6
      pitch: 1.2

  # Returns to the main menu. player_command closes the inventory itself in
  # RoyalSkyblock, so this needs no separate close effect: unlike the other
  # menus, which reach main with open_menu.
  - item: arrow name:"&fBack"
    lore:
      - "&7Return to the main menu."
    row: 6
    column: 3
    # The menu plays its own open sound; without this the two land together and
    # are heard as one doubled click.
    silent: true
    left-click:
      - id: player_command
        args: {command: "menu"}
    sound:
      name: UI_BUTTON_CLICK
      volume: 0.6
      pitch: 1.2

# The balance summary. %balance% %level% %level_name% %max_balance% %next_interest%
header:
  item: gold_ingot name:"&6&lPersonal Bank"
  lore:
    - "&7Balance: &e%balance%"
    - "&7Level: &f%level% &8- %level_name%"
    - "&7Max balance: &f%max_balance%"
    - "&7Next interest: &f%next_interest%"
  # when no economy plugin is installed (no buttons are shown then)
  lore-unavailable:
    - "&7Balance: &e%balance%"
    - "&7Level: &f%level% &8- %level_name%"
    - "&7Max balance: &f%max_balance%"
    - "&7Next interest: &f%next_interest%"
    - ""
    - "&cNo economy plugin: banking disabled."
  row: 1
  column: 5

# The bank buttons. deposit and withdraw get one button per amount in coop.bank.amounts
# (config.yml), placed in the listed positions in order; %amount% is that amount.
buttons:
  deposit:
    item: lime_dye name:"&a&lDeposit %amount%"
    lore:
      - "&7From your purse to bank."
      - ""
      - "&eClick to deposit!"
    positions:
      - {row: 3, column: 2}
      - {row: 3, column: 4}
      - {row: 3, column: 6}
  # hidden from members who may not withdraw (coop.bank.withdraw-requires-manager)
  withdraw:
    item: gold_nugget name:"&6&lWithdraw %amount%"
    lore:
      - "&7From bank to your purse."
      - ""
      - "&eClick to withdraw!"
    positions:
      - {row: 4, column: 2}
      - {row: 4, column: 4}
      - {row: 4, column: 6}
  deposit-all:
    item: lime_wool name:"&a&lDeposit All"
    lore:
      - "&7Deposit your whole purse"
      - "&7(up to the level cap)."
      - ""
      - "&eClick to deposit!"
    row: 3
    column: 8
  withdraw-all:
    item: gold_block name:"&6&lWithdraw All"
    lore:
      - "&7Withdraw the whole balance"
      - "&7to your purse."
      - ""
      - "&eClick to withdraw!"
    row: 4
    column: 8
  # claim-interest when interest is ready, interest-waiting until then (same slot). %time%
  claim-interest:
    item: experience_bottle name:"&a&lClaim Interest"
    lore:
      - "&7Interest is ready."
      - ""
      - "&eClick to claim!"
    row: 5
    column: 2
  interest-waiting:
    item: clock name:"&7Interest"
    lore:
      - "&7Next interest in &f%time%&7."
    row: 5
    column: 2
  # upgrade until the top level, then maxed (same slot).
  # %next_level% %cost% %max_balance%, plus %items% in lore-items (levels that need items)
  upgrade:
    item: anvil name:"&6&lUpgrade Bank"
    lore:
      - "&7Next: &f%next_level%"
      - "&7Cost: &e%cost%"
      - "&7New max balance: &f%max_balance%"
      - ""
      - "&eClick to upgrade!"
    lore-items:
      - "&7Next: &f%next_level%"
      - "&7Cost: &e%cost%"
      - "&7Items: &f%items%"
      - "&7New max balance: &f%max_balance%"
      - ""
      - "&eClick to upgrade!"
    row: 5
    column: 4
  maxed:
    item: nether_star name:"&a&lBank Maxed"
    lore:
      - "&7This bank is at the highest level."
    row: 5
    column: 4
  transactions:
    item: book name:"&e&lTransactions"
    lore:
      - "&7Recent bank activity."
      - ""
      - "&eClick to view!"
    row: 5
    column: 6
