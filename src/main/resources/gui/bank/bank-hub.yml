#  RoyalSkyblock  ·  Bank
#  Shown on a Coop profile: pick which bank to open. Personal Bank is your own
#  per-profile RoyalBank account (native /bank); Coop Bank is the shared account.
#
#  rows: 1-6. mask: 1 = filler pane, 0 = dynamic slot. Slots are placed by row/column.
#  click ids: open_menu, close, player_command, console_command, message, play_sound
#  sound: on a slot is its click sound (name / volume / pitch, or enabled: false).
#  A slot without one is silent; leave buttons that open another menu silent so
#  the destination's open sound doesn't double up.

title: "&8Skyblock &7» &fBank"
rows: 3

# Menu sounds (enabled: false silences one). Click sounds live on each slot.
#   open     - when the menu is opened
#   content  - when a generated button that closes the menu is clicked
sounds:
  open:
    enabled: true
    name: UI_BUTTON_CLICK
    volume: 0.7
    pitch: 1.2

pages:
  - page: 1
    mask:
      items:
        - black_stained_glass_pane
      pattern:
        - "111111111"
        - "111111111"
        - "111111111"

slots:
  - item: player_head name:"&a&lPersonal Bank"
    lore:
      - "&7Your own bank for this profile."
      - "&7Deposit, withdraw, upgrade, interest."
      - ""
      - "&eClick to open!"
    row: 2
    column: 3
    left-click:
      - id: open_menu
        args:
          menu: bank-personal

  - item: gold_ingot name:"&6&lCoop Bank"
    lore:
      - "&7The shared coop balance."
      - "&7Deposit together to build or buy."
      - ""
      - "&eClick to open!"
    row: 2
    column: 7
    left-click:
      - id: open_menu
        args:
          menu: coop-bank

  # footer
  - item: arrow name:"&7« Back"
    lore:
      - "&7Return to Coop Members."
    row: 3
    column: 4
    left-click:
      - id: open_menu
        args:
          menu: coop

  - item: barrier name:"&cClose"
    lore:
      - "&7Close this menu."
    row: 3
    column: 6
    left-click:
      - id: close
    sound:
      name: UI_BUTTON_CLICK
      volume: 0.6
      pitch: 1.2
