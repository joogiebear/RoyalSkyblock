#  RoyalSkyblock  ·  Island Perks
#  The 0 slots fill at runtime with the perks from perks.yml: unlocked ones show
#  their icon, locked ones are greyed with the level needed. Perks are OPTIONAL and
#  off by default; this menu is only reachable when they're enabled.
#
#  rows: 1-6. mask: 1 = filler pane, 0 = dynamic slot. Slots are placed by row/column.
#  click ids: open_menu, close, player_command, console_command, message, play_sound
#  sound: on a slot is its click sound (name / volume / pitch, or enabled: false).
#  A slot without one is silent; leave buttons that open another menu silent so
#  the destination's open sound doesn't double up.

title: "&8Skyblock &7» &fPerks"
rows: 6

# Menu sounds (enabled: false silences one). Click sounds live on each slot.
#   open     - when the menu is opened
#   content  - when a generated button that closes the menu is clicked
sounds:
  open:
    enabled: true
    name: UI_BUTTON_CLICK
    volume: 0.7
    pitch: 1.2

pages:
  - page: 1
    mask:
      items:
        - black_stained_glass_pane
      pattern:
        - "111111111"
        - "100000001"
        - "100000001"
        - "100000001"
        - "111111111"
        - "111111111"

slots:
  # header
  - item: nether_star name:"&d&lIsland Perks"
    lore:
      - "&7Perks unlock as your island's"
      - "&7level rises. Stand on your island"
      - "&7to enjoy them."
    row: 1
    column: 5

  # footer
  - item: arrow name:"&7« Back"
    lore:
      - "&7Return to the island level menu."
    row: 6
    column: 4
    left-click:
      - id: open_menu
        args:
          menu: level

  - item: barrier name:"&cClose"
    lore:
      - "&7Close this menu."
    row: 6
    column: 6
    left-click:
      - id: close
    sound:
      name: UI_BUTTON_CLICK
      volume: 0.6
      pitch: 1.2

# An unlocked perk. Its material is the perk's icon. %name% %required_level%, and a line that is
# just %description% becomes the perk's description lines.
entry-unlocked:
  name: "%name% &a✔"
  lore:
    - "%description%"
    - ""
    - "&7Requires island level &f%required_level%"
    - "&a✔ Unlocked"
# A perk the island hasn't reached yet. Same placeholders.
entry-locked:
  item: gray_dye name:"%name% &8(locked)"
  lore:
    - "%description%"
    - ""
    - "&7Requires island level &f%required_level%"
    - "&c✘ Locked: reach level %required_level%"

# In the first 0 slot when perks are turned off, or none are configured.
disabled:
  item: barrier name:"&cPerks are disabled"
  lore:
    - "&7This server has perks turned off."
    - "&8(admins: set perks.enabled in config.yml)"
empty:
  item: paper name:"&7No perks configured"
  lore:
    - "&7Add perks in perks.yml."
