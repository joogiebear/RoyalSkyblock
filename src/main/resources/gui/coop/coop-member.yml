#  RoyalSkyblock  ·  Manage Member
#  Opened by clicking a member in the Coop Members menu. The member's head and the
#  Promote/Demote · Transfer Ownership · Remove buttons are placed by code (they
#  depend on the target's rank and yours); this file is just the frame + nav.
#
#  rows: 1-6. mask: 1 = filler pane, 0 = dynamic slot. Slots are placed by row/column.
#  click ids: open_menu, close, player_command, console_command, message, play_sound
#  sound: on a slot is its click sound (name / volume / pitch, or enabled: false).
#  A slot without one is silent; leave buttons that open another menu silent so
#  the destination's open sound doesn't double up.

title: "&8Skyblock &7» &fCoop Member"
rows: 3

# Menu sounds (enabled: false silences one). Click sounds live on each slot.
#   open     - when the menu is opened
#   content  - when a generated button that closes the menu is clicked
sounds:
  open:
    enabled: true
    name: UI_BUTTON_CLICK
    volume: 0.7
    pitch: 1.2

pages:
  - page: 1
    mask:
      items:
        - black_stained_glass_pane
      pattern:
        - "111111111"
        - "111111111"
        - "111111111"

slots:
  # footer (member head + action buttons are placed by code)
  - item: arrow name:"&7« Back"
    lore:
      - "&7Return to the roster."
    row: 3
    column: 4
    left-click:
      - id: open_menu
        args:
          menu: coop

  - item: barrier name:"&cClose"
    lore:
      - "&7Close this menu."
    row: 3
    column: 6
    left-click:
      - id: close
    sound:
      name: UI_BUTTON_CLICK
      volume: 0.6
      pitch: 1.2
