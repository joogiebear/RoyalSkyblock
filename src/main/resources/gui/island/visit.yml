#  RoyalSkyblock  ·  Visit an Island
#  The 0 slots fill at runtime with visitable islands: only those with Visitors +
#  Listing enabled and matching your profile's gamemode. Click an island head to
#  visit it.
#
#  rows: 1-6. mask: 1 = filler pane, 0 = dynamic slot. Slots are placed by row/column.
#  click ids: open_menu, close, player_command, console_command, message, play_sound
#  sound: on a slot is its click sound (name / volume / pitch, or enabled: false).
#  A slot without one is silent; leave buttons that open another menu silent so
#  the destination's open sound doesn't double up.

title: "&8Skyblock &7» &fVisit Islands"
rows: 6

# Menu sounds (enabled: false silences one). Click sounds live on each slot.
#   open     - when the menu is opened
#   content  - when a generated button that closes the menu is clicked
sounds:
  open:
    enabled: true
    name: UI_BUTTON_CLICK
    volume: 0.7
    pitch: 1.2
  # Generated buttons (the entries filled into the mask) have no config slot of their own
  # to carry a sound:, so theirs comes from here. Set only on menus whose generated buttons
  # CLOSE the inventory: the ones that reopen a menu are already covered by its open sound.
  content:
    enabled: true
    name: UI_BUTTON_CLICK
    volume: 0.6
    pitch: 1.2

pages:
  - page: 1
    mask:
      items:
        - black_stained_glass_pane
      pattern:
        - "111111111"
        - "100000001"
        - "100000001"
        - "100000001"
        - "111111111"
        - "111111111"

slots:
  # footer
  - item: arrow name:"&7« Back"
    lore:
      - "&7Return to the main menu."
    row: 6
    column: 4
    left-click:
      - id: open_menu
        args:
          menu: main

  - item: barrier name:"&cClose"
    lore:
      - "&7Close this menu."
    row: 6
    column: 6
    left-click:
      - id: close
    sound:
      name: UI_BUTTON_CLICK
      volume: 0.6
      pitch: 1.2
