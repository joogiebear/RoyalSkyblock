#  RoyalSkyblock  ·  Island Upgrades
#  A slot with `content: <upgrade-key>` renders that upgrade's live icon (current /
#  next tier, cost, skip cost, timer): pin them at any row/column. Left-click an
#  upgrade to start it, right-click to skip an in-progress one. Keys come from
#  upgrades.yml (size / guest-limit / coop-slots / generator / minions).
#
#  rows: 1-6. mask: 1 = filler pane, 0 = dynamic slot. Slots are placed by row/column.
#  click ids: open_menu, close, player_command, console_command, message, play_sound
#  sound: on a slot is its click sound (name / volume / pitch, or enabled: false).
#  A slot without one is silent; leave buttons that open another menu silent so
#  the destination's open sound doesn't double up.

title: "&8Skyblock &7» &fUpgrades"
rows: 6

# Menu sounds (enabled: false silences one). Click sounds live on each slot.
#   open     - when the menu is opened
#   content  - when a generated button that closes the menu is clicked
sounds:
  open:
    enabled: true
    name: UI_BUTTON_CLICK
    volume: 0.7
    pitch: 1.2

pages:
  - page: 1
    mask:
      items:
        - black_stained_glass_pane
      pattern:
        - "111111111"
        - "111111111"
        - "111111111"
        - "111111111"
        - "111111111"
        - "111111111"

slots:
  # the upgrades (pinned; rearrange freely)
  - content: size
    row: 3
    column: 1
  - content: guest-limit
    row: 3
    column: 3
  - content: coop-slots
    row: 3
    column: 5
  - content: generator
    row: 3
    column: 7
  - content: minions
    row: 3
    column: 9
  # Sanctuary is pure libreforge effects rather than an island mechanic, so it sits
  # below the mechanical tracks rather than beside them.
  - content: sanctuary
    row: 4
    column: 5

  # footer
  - item: arrow name:"&7« Back"
    lore:
      - "&7Return to the main menu."
    row: 6
    column: 4
    left-click:
      - id: open_menu
        args:
          menu: main

  - item: barrier name:"&cClose"
    lore:
      - "&7Close this menu."
    row: 6
    column: 6
    left-click:
      - id: close
    sound:
      name: UI_BUTTON_CLICK
      volume: 0.6
      pitch: 1.2

# The icon of each upgrade track. Its material is the track's icon (upgrades/*.yml).
# Always: %name% %description% %tier% %max_tier%
entry:
  name: "%name% &7(Tier %tier%/%max_tier%)"
  # Next tier available. Also: %next_tier% %effect% %cost% %wait%
  lore:
    - "&7%description%"
    - ""
    - "&7Next: tier %next_tier%%effect%"
    - "&7Cost: &e%cost%%wait%"
    - ""
    - "&eClick to upgrade"
  # The same when the next tier can be skipped for a price. Also: %skip_cost%
  lore-skippable:
    - "&7%description%"
    - ""
    - "&7Next: tier %next_tier%%effect%"
    - "&7Cost: &e%cost%%wait%"
    - "&7Skip cost: &e%skip_cost%"
    - ""
    - "&eClick to upgrade &7(right-click after to skip)"
  lore-maxed:
    - "&7%description%"
    - ""
    - "&a✔ Maxed out."
  # A tier is on its timer. Also: %target_tier% %time_left%
  lore-upgrading:
    - "&7%description%"
    - ""
    - "&e⏳ Upgrading to tier %target_tier% &7- %time_left% left"
  # The same when the wait can be skipped. Also: %skip_cost%
  lore-upgrading-skippable:
    - "&7%description%"
    - ""
    - "&e⏳ Upgrading to tier %target_tier% &7- %time_left% left"
    - "&7Skip now: &e%skip_cost%"
    - ""
    - "&eRight-click to skip the wait."
  # %effect%: what the next tier gives (%label%, from effect-labels below); left out when there is none
  effect: " &8(%label%)"
  # %wait%: left out for an instant tier. %time%
  wait: " &7+ %time% wait"

# What the next tier of each upgrade kind gives. %value% is the tier's value; radius also has
# %size% (the island's full width). The -plural form is used when %value% isn't 1.
effect-labels:
  radius: "%size%x%size%"
  guest-slots: "+%value% guest"
  guest-slots-plural: "+%value% guests"
  coop-slots: "+%value% coop slot"
  coop-slots-plural: "+%value% coop slots"
  generator: "Tier %value% ores"
  minions: "+%value% minion slot"
  minions-plural: "+%value% minion slots"
